name: Package download count

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.github/workflows/download-count.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-download-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const count = releases
              .filter(release => !release.draft)
              .flatMap(release => release.assets)
              .filter(asset => /^EdgeControl-.*-macOS\.(dmg|zip)$/i.test(asset.name))
              .reduce((total, asset) => total + asset.download_count, 0);
            const badge = {
              schemaVersion: 1,
              label: 'Package downloads',
              message: String(count),
              color: '2ea44f',
            };
            const content = JSON.stringify(badge, null, 2) + '\n';
            // Keep counter-only commits off main and out of release assets.
            const branch = 'download-stats';
            const path = 'downloads.json';
            const { data: current } = await github.rest.repos.getContent({
              owner, repo, path, ref: branch,
            });
            if (Buffer.from(current.content, 'base64').toString('utf8') === content) {
              core.info('Package download count unchanged: ' + count);
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch, sha: current.sha,
              message: 'Update package download count',
              content: Buffer.from(content).toString('base64'),
            });
            core.info('Package download count updated: ' + count);
