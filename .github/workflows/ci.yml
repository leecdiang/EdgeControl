name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository invariants
        run: ./Scripts/validate_repository.sh

      - name: Run unit tests
        run: ./Scripts/build_release.sh test

      - name: Build unsigned Release
        run: ./Scripts/build_release.sh build
