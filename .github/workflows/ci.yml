name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository invariants
        run: ./Scripts/validate_repository.sh

      - name: Run unit tests
        run: ./Scripts/build_release.sh test

      - name: Build unsigned Release
        run: ./Scripts/build_release.sh build

      - name: Package validated release candidate
        run: |
          ./Scripts/package_dmg.sh "$PWD/build/DerivedData/Build/Products/Release/EdgeControl.app" "$PWD/build/EdgeControl-macOS.dmg"
          hdiutil verify build/EdgeControl-macOS.dmg
          printf '%s\n' "$GITHUB_SHA" > build/SOURCE_COMMIT
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Release/EdgeControl.app build/EdgeControl-macOS.zip
          unzip -t build/EdgeControl-macOS.zip
          shasum -a 256 build/EdgeControl-macOS.dmg build/EdgeControl-macOS.zip > build/SHA256SUMS

      - name: Retain candidate packages and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: EdgeControl-candidate-${{ github.sha }}
          path: |
            build/EdgeControl-macOS.dmg
            build/EdgeControl-macOS.zip
            build/SHA256SUMS
            build/SOURCE_COMMIT
            build/DerivedData/Logs/Test/*.xcresult
          retention-days: 14
